name: Pre-commit

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
